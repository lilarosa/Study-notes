<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记账本练习</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card summary-card">
        <h1>记账本</h1>
        <p class="subtitle">练习表单、计算、列表渲染和本地存储。</p>

        <div class="summary">
          <div>
            <span class="label">总支出</span>
            <strong id="total-expense">0</strong>
          </div>
          <div>
            <span class="label">本月条目</span>
            <strong id="entry-count">0</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>新增记录</h2>
        <form id="expense-form">
          <label>
            描述
            <input id="description" type="text" placeholder="例如：晚餐" required />
          </label>

          <label>
            金额
            <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required />
          </label>

          <label>
            分类
            <select id="category">
              <option value="饮食">饮食</option>
              <option value="交通">交通</option>
              <option value="娱乐">娱乐</option>
              <option value="购物">购物</option>
              <option value="其他">其他</option>
            </select>
          </label>

          <label>
            日期
            <input id="date" type="date" required />
          </label>

          <button type="submit">添加记录</button>
        </form>
      </section>

      <section class="card">
        <h2>消费记录</h2>
        <ul id="expense-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
