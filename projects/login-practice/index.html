<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录注册练习</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="switcher" role="tablist" aria-label="登录注册切换">
          <button class="switch-btn active" data-mode="login" type="button">登录</button>
          <button class="switch-btn" data-mode="register" type="button">注册</button>
        </div>

        <h1 id="form-title">欢迎回来</h1>
        <p class="subtitle">练习真实前端项目中常见的登录与注册流程。</p>

        <div id="message" class="message" aria-live="polite"></div>

        <form id="login-form" class="auth-form">
          <label>
            用户名或邮箱
            <input id="login-identifier" type="text" placeholder="请输入用户名或邮箱" required />
          </label>

          <label class="password-field">
            密码
            <input id="login-password" type="password" placeholder="请输入密码" required />
            <button class="toggle-password" type="button" data-target="login-password">显示</button>
          </label>

          <label class="checkbox-row">
            <input id="remember-me" type="checkbox" />
            <span>记住我</span>
          </label>

          <button class="submit-btn" type="submit">登录</button>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label>
            用户名
            <input id="register-name" type="text" placeholder="请输入用户名" required />
          </label>

          <label>
            邮箱
            <input id="register-email" type="email" placeholder="请输入邮箱" required />
          </label>

          <label class="password-field">
            密码
            <input id="register-password" type="password" placeholder="请输入密码" required />
            <button class="toggle-password" type="button" data-target="register-password">显示</button>
          </label>

          <label class="password-field">
            确认密码
            <input id="confirm-password" type="password" placeholder="请再次输入密码" required />
            <button class="toggle-password" type="button" data-target="confirm-password">显示</button>
          </label>

          <button class="submit-btn" type="submit">注册</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
